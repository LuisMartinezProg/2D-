name: Deploy MochiGo Editor to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (todo el workspace)
        run: npm install

      - name: Build all packages (en orden de dependencias)
        run: |
          npm run build --workspace=@mochigo/math
          npm run build --workspace=@mochigo/ecs
          npm run build --workspace=@mochigo/events
          npm run build --workspace=@mochigo/assets
          npm run build --workspace=@mochigo/renderer
          npm run build --workspace=@mochigo/physics
          npm run build --workspace=@mochigo/input
          npm run build --workspace=@mochigo/animation
          npm run build --workspace=@mochigo/scenes
          npm run build --workspace=@mochigo/sound
          npm run build --workspace=@mochigo/scripting
          npm run build --workspace=@mochigo/storage

      - name: Build editor
        run: npm run build --workspace=@mochigo/editor

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
